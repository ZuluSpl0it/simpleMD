[project]
name = "flatnotes-desktop"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pywebview>=6,<7",
    "whoosh==2.7.4",
    "watchdog>=6,<7",
]

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
