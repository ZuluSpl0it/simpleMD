<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0.5;url=./index.html" />
    <title>Flatnotes</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171717; color: #e5e7eb; }
      main { text-align: center; }
      .spinner { width: 24px; height: 24px; margin: 0 auto 12px; border: 3px solid #4b5563; border-top-color: #f97316; border-radius: 50%; animation: spin .8s linear infinite; }
      a { display: inline-block; margin-top: 18px; color: #fb923c; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner"></div>
      <div>Starting Flatnotes…</div>
      <a href="./index.html">Continue</a>
    </main>
    <script>setTimeout(() => { window.location.replace("./index.html"); }, 500);</script>
  </body>
</html>
